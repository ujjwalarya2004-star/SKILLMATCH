# One command to run everything:  docker compose up --build
# App:  http://localhost:8080/skillmatch
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: skillmatch_db
    ports:
      - "3307:3306"          # host 3307 -> avoids clashing with a local MySQL on 3306
    volumes:
      - ./skillmatch_db.sql:/docker-entrypoint-initdb.d/01-skillmatch_db.sql:ro
      - dbdata:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/skillmatch_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DB_USER: root
      DB_PASSWORD: root
    ports:
      - "8080:8080"

volumes:
  dbdata:
